name: Update Activity Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # daily auto-update (optional)

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dist folder
        run: mkdir -p dist

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: alee-abbas-09
          options: theme=tokyo-night&hide_border=true&area=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check generated file
        run: |
          ls -la dist
          ls -lh dist/activity-graph.svg

      - name: Publish activity graph
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: activity-graph
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
